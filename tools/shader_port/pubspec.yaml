name: shader_port
description: >
  Utilities for extracting CryEngine shaders, building an intermediate
  representation, and generating Metal/HLSL source along with pipeline metadata.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  args: ^2.4.2
  path: ^1.8.3

dev_dependencies:
  lints: ^2.1.1
  test: ^1.25.2

executables:
  shader_metal_backlog: shader_metal_backlog
  render_gates_diagnosis: render_gates_diagnosis
  load_sequence_diagnosis: load_sequence_diagnosis

